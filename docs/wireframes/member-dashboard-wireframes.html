document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

6-05-27 so\n                                    white text on red clears WCAG AA (4.5:1) */\n  --rycm-off-white: #f1f1f1;     /* Anti-Flash White */\n  --rycm-white: #ffffff;\n  --rycm-black: #000000;\n\n  /* ── Extended neutrals (from the live site) ── */\n  --rycm-ink: #161622;           /* Body copy on light */\n  --rycm-muted: #6d6d7c;         /* Secondary copy on light */\n  --rycm-navy-lift: #101044;     /* Footer gradient top */\n  --rycm-line: rgba(7, 6, 48, 0.13);\n  --rycm-line-soft: rgba(7, 6, 48, 0.028);\n  --rycm-tint: rgba(7, 6, 48, 0.06);\n\n  /* ── On-dark scale ── */\n  --rycm-on-dark: #ffffff;\n  --rycm-on-dark-strong: rgba(255, 255, 255, 0.9);\n  --rycm-on-dark-body: rgba(255, 255, 255, 0.82);\n  --rycm-on-dark-muted: rgba(255, 255, 255, 0.72);\n  --rycm-on-dark-faint: rgba(255, 255, 255, 0.5);\n  --rycm-on-dark-line: rgba(255, 255, 255, 0.14);\n  --rycm-on-dark-fill: rgba(255, 255, 255, 0.07);\n\n  /* ── Semantic aliases ── */\n  --rycm-text-body: var(--rycm-ink);\n  --rycm-text-heading: var(--rycm-navy);\n  --rycm-text-muted: var(--rycm-muted);\n  --rycm-text-accent: var(--rycm-red);\n  --rycm-surface-page: var(--rycm-off-white);\n  --rycm-surface-card: rgba(255, 255, 255, 0.78);\n  --rycm-surface-card-solid: var(--rycm-white);\n  --rycm-surface-dark: var(--rycm-navy);\n  --rycm-surface-accent: var(--rycm-red);\n  --rycm-border: var(--rycm-line);\n  --rycm-link: var(--rycm-ink);\n  --rycm-link-hover: var(--rycm-red);\n  --rycm-focus: var(--rycm-red);\n\n  /* ── Compatibility aliases: the exact token names used in the\n     resultsyoucanmeasure.com stylesheet. Kept so code lifted from the site\n     works unchanged. ── */\n  --navy: var(--rycm-navy);\n  --red: var(--rycm-red);\n  --off: var(--rycm-off-white);\n  --white: var(--rycm-white);\n  --black: var(--rycm-black);\n  --ink: var(--rycm-ink);\n  --muted: var(--rycm-muted);\n  --line: var(--rycm-line);\n}\n<\u002Fstyle>\n<style>:root {\n  --rycm-font-sans: \"DM Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --rycm-font-body: var(--rycm-font-sans);\n  --rycm-font-heading: var(--rycm-font-sans);\n  /* Only non-DM-Sans face on the brand: the oversized decorative quote mark */\n  --rycm-font-quote-mark: Georgia, \"Times New Roman\", serif;\n\n  /* Weights. Guidelines name Semibold + Medium as primary, Regular + Light as\n     secondary; the live site pushes to 800/900 for display and UI emphasis. */\n  --rycm-weight-light: 300; /* @kind other */\n  --rycm-weight-regular: 400; /* @kind other */\n  --rycm-weight-medium: 500; /* @kind other */\n  --rycm-weight-semibold: 600; /* @kind other */\n  --rycm-weight-bold: 700; /* @kind other */\n  --rycm-weight-extrabold: 800; /* @kind other */\n  --rycm-weight-black: 900;\n\n  /* Display — uppercase, near-solid leading, no letter-spacing */\n  --rycm-size-hero: clamp(2.6rem, 5vw, 6rem);\n  --rycm-lh-hero: 0.92; /* @kind other */\n  --rycm-size-panel: clamp(2.4rem, 5vw, 5.5rem);\n  --rycm-lh-panel: 0.9; /* @kind other */\n  --rycm-size-h2: clamp(1.7rem, 3.55vw, 3.3rem);\n  --rycm-lh-h2: 1.05; /* @kind other */\n  --rycm-size-h3: clamp(1.5rem, 2.4vw, 2.3rem);\n  --rycm-lh-h3: 1; /* @kind other */\n  --rycm-size-quote: clamp(2rem, 5vw, 5.2rem);\n  --rycm-lh-quote: 1; /* @kind other */\n  --rycm-size-wordmark: clamp(5rem, 18vw, 23rem);\n\n  /* Text */\n  --rycm-size-lede: clamp(1.08rem, 1.7vw, 1.45rem);\n  --rycm-lh-lede: 1.45; /* @kind other */\n  --rycm-size-body-lg: 1.15rem;\n  --rycm-size-article: 1.18rem;\n  --rycm-size-body: 1rem;\n  --rycm-size-small: 0.95rem;\n  --rycm-size-meta: 0.9rem;\n  --rycm-size-eyebrow: 14px;\n  --rycm-lh-body: 1.65; /* @kind other */\n  --rycm-lh-article: 1.7; /* @kind other */\n  --rycm-lh-tight: 1.45; /* @kind other */\n\n  --rycm-ls-eyebrow: 0.07em; /* @kind other */\n  --rycm-ls-display: 0; /* @kind other */\n  --rycm-ls-negative: -0.02em; /* @kind other */\n  --rycm-ls-label: 0.04em; /* @kind other */\n}\n<\u002Fstyle>\n<style>:root {\n  --rycm-space-1: 4px;\n  --rycm-space-2: 8px;\n  --rycm-space-3: 12px;\n  --rycm-space-4: 16px;\n  --rycm-space-5: 18px;   /* the grid gap used across every card grid */\n  --rycm-space-6: 22px;\n  --rycm-space-7: 26px;   /* card padding */\n  --rycm-space-8: 28px;\n  --rycm-space-10: 34px;\n  --rycm-space-12: 42px;\n  --rycm-space-16: 56px;\n  --rycm-space-20: 72px;\n\n  /* Fluid page rhythm — the site never uses a fixed container width, it uses\n     symmetric fluid page padding and lets content max-widths do the framing. */\n  --rycm-page-pad: clamp(18px, 5vw, 72px);\n  --rycm-section-y: clamp(40px, 5vw, 72px); /* @kind spacing */\n  --rycm-hero-y: clamp(42px, 7vw, 90px); /* @kind spacing */\n  --rycm-card-pad: clamp(24px, 4vw, 42px);\n  --rycm-grid-gap: 18px;\n  --rycm-grid-gap-lg: clamp(18px, 2vw, 28px);\n  --rycm-texture-grid: 72px;\n\n  /* Content max-widths */\n  --rycm-measure-display: 980px;\n  --rycm-measure-lede: 710px;\n  --rycm-measure-copy: 820px;\n  --rycm-measure-article: 900px;\n\n  --page-pad: var(--rycm-page-pad);\n}\n<\u002Fstyle>\n<style>:root {\n  --rycm-radius: 8px;             /* buttons, cards, panels — the default */\n  --rycm-radius-sm: 4px;          /* editorial case cards, chips on dark */\n  --rycm-radius-lg: 14px;         /* mega menu */\n  --rycm-radius-xl: 18px;         /* chat bubbles, proof panels */\n  --rycm-radius-pill: 999px;      /* tag row */\n  --rycm-radius-circle: 50%;      /* process numerals, avatars */\n\n  --rycm-border: 1px solid var(--rycm-line);\n  --rycm-border-dark: 1px solid var(--rycm-on-dark-line);\n  --rycm-border-strong: 1.5px solid var(--rycm-navy);\n  --rycm-rule-accent: 3px solid var(--rycm-red);\n\n  --rycm-shadow-card: 0 10px 30px rgba(7, 6, 48, 0.06);\n  --rycm-shadow-card-hover: 0 26px 64px rgba(7, 6, 48, 0.16);\n  --rycm-shadow-panel: 0 18px 48px rgba(7, 6, 48, 0.12);\n  --rycm-shadow-xl: 0 24px 70px rgba(7, 6, 48, 0.22);\n  --rycm-shadow-editorial: 0 30px 80px rgba(7, 6, 48, 0.25);\n  --rycm-shadow-bubble: 0 8px 28px rgba(0, 0, 0, 0.22);\n  --rycm-shadow-menu: 0 28px 80px rgba(0, 0, 0, 0.5);\n\n  --rycm-blur-header: blur(16px); /* @kind other */\n  --rycm-blur-menu: blur(20px); /* @kind other */\n  --rycm-header-bg: rgba(7, 6, 48, 0.92);\n\n  /* Protection gradients — how type stays legible over photography/video.\n     Always navy-tinted, never neutral black. */\n  --rycm-scrim-left: linear-gradient(90deg, rgba(7, 6, 48, 0.88) 0%, rgba(7, 6, 48, 0.54) 55%, rgba(7, 6, 48, 0.28) 100%); /* @kind other */\n  --rycm-scrim-bottom: linear-gradient(to top, rgba(7, 6, 48, 0.72) 0%, rgba(7, 6, 48, 0.05) 55%); /* @kind other */\n  --rycm-scrim-card: linear-gradient(180deg, rgba(7, 6, 48, 0.06) 0%, rgba(7, 6, 48, 0.08) 42%, rgba(7, 6, 48, 0.86) 100%); /* @kind other */\n\n  /* Signature background textures */\n  --rycm-texture-grid-light: linear-gradient(90deg, rgba(7, 6, 48, 0.035) 1px, transparent 1px),\n    linear-gradient(rgba(7, 6, 48, 0.035) 1px, transparent 1px); /* @kind other */\n  --rycm-texture-grid-dark: linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),\n    linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px); /* @kind other */\n  --rycm-glow-red: radial-gradient(circle at 12% 20%, rgba(248, 55, 57, 0.24), transparent 30%); /* @kind other */\n\n  --radius: var(--rycm-radius);\n  --shadow: var(--rycm-shadow-xl);\n}\n<\u002Fstyle>\n<style>:root {\n  /* Two easings do almost all the work on this brand. */\n  --rycm-ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */  /* reveals, card rise, wordmark */\n  --rycm-ease-back: cubic-bezier(0.175, 0.885, 0.32, 1.275); /* @kind other */ /* chat bubbles — the one overshoot */\n  --rycm-ease: ease; /* @kind other */\n\n  --rycm-dur-hover: 0.15s; /* @kind other */\n  --rycm-dur-menu: 0.18s; /* @kind other */\n  --rycm-dur-ui: 0.25s; /* @kind other */\n  --rycm-dur-reveal: 0.45s; /* @kind other */\n  --rycm-dur-image: 0.65s; /* @kind other */\n  --rycm-dur-bubble: 0.5s; /* @kind other */\n  --rycm-dur-wordmark: 1.45s; /* @kind other */\n\n  --rycm-stagger-bubble: 0.52s; /* @kind other */\n  --rycm-stagger-char: 0.11s; /* @kind other */\n\n  --rycm-lift-hover: -4px;   /* nav cards lift on hover */\n  --rycm-scale-image-hover: 1.04; /* @kind other */\n}\n\n@media (prefers-reduced-motion: reduce) {\n  :root {\n    --rycm-dur-reveal: 0.01s; /* @kind other */\n    --rycm-dur-image: 0.01s; /* @kind other */\n    --rycm-dur-bubble: 0.01s; /* @kind other */\n    --rycm-dur-wordmark: 0.01s; /* @kind other */\n  }\n}\n<\u002Fstyle>\n<style>/* RYCM Admin (the forms / ops console) runs a deliberately quiet slate UI —\n   it is an internal tool, not a brand surface. Only the logo and the accent\n   carry the brand, and it does NOT use the brand typeface: the real console\n   sets Inter (apps/admin/src/styles/global.css). Scope these by putting\n   .rycm-admin on a wrapper. */\n.rycm-admin {\n  --admin-bg: #fafafa;\n  --admin-fg: #0f172a;\n  --admin-muted: #64748b;\n  --admin-border: #e2e8f0;\n  --admin-card: #ffffff;\n  --admin-primary: #0f172a;\n  --admin-primary-fg: #ffffff;\n  --admin-accent: #2563eb;\n  --admin-danger: #b91c1c;\n\n  --admin-success-bg: #d1fae5;\n  --admin-success-fg: #065f46;\n  --admin-warning-bg: #fef3c7;\n  --admin-warning-fg: #92400e;\n  --admin-danger-bg: #fee2e2;\n  --admin-danger-fg: #991b1b;\n  --admin-muted-bg: #f1f5f9;\n  --admin-muted-fg: #475569;\n\n  --admin-radius: 6px;\n  --admin-radius-lg: 8px;\n  --admin-shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);\n  --admin-sidebar-w: 240px; /* @kind other */\n  --admin-font: Inter, ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --admin-row-h: 36px; /* @kind other */\n  --admin-control-h: 40px; /* @kind other */\n  --admin-control-h-sm: 32px; /* @kind other */\n\n  background: var(--admin-bg);\n  color: var(--admin-fg);\n  font-family: var(--admin-font);\n}\n<\u002Fstyle>\n<style>/* Interaction states and signature backgrounds that need real CSS (pseudo\n   classes, keyframes, masks) rather than inline style. Components in this\n   system attach these class names alongside their inline token styles. */\n\n.rycm-body {\n  margin: 0;\n  font-family: var(--rycm-font-body);\n  color: var(--rycm-ink);\n  background: var(--rycm-off-white);\n  -webkit-font-smoothing: antialiased;\n}\n\na { color: var(--rycm-link); }\na:hover { color: var(--rycm-link-hover); }\n\n/* The site's ambient texture: a 72px navy grid fading out down the page. */\n.rycm-grid-texture::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  pointer-events: none;\n  background: var(--rycm-texture-grid-light);\n  background-size: var(--rycm-texture-grid) var(--rycm-texture-grid);\n  mask-image: linear-gradient(to bottom, black, transparent 75%);\n}\n.rycm-grid-texture--dark::before {\n  background: var(--rycm-texture-grid-dark);\n  background-size: var(--rycm-texture-grid) var(--rycm-texture-grid);\n  mask-image: linear-gradient(to bottom, transparent 0, black 18%, black 82%, transparent 100%);\n}\n\n/* Buttons — hover is a small darkening / fill, never a scale or a shadow pop. */\n.rycm-btn { transition: background var(--rycm-dur-hover) var(--rycm-ease), color var(--rycm-dur-hover) var(--rycm-ease), border-color var(--rycm-dur-hover) var(--rycm-ease), opacity var(--rycm-dur-hover) var(--rycm-ease); }\n.rycm-btn--primary:hover { background: #c01f23; border-color: #c01f23; }\n.rycm-btn--secondary:hover { background: var(--rycm-navy); border-color: var(--rycm-navy); color: var(--rycm-white); }\n.rycm-btn--outline:hover { border-color: var(--rycm-white); background: rgba(255, 255, 255, 0.08); }\n.rycm-btn:active { opacity: 0.9; }\n.rycm-btn:focus-visible, .rycm-focusable:focus-visible { outline: 2px solid var(--rycm-focus); outline-offset: 2px; }\n\n.rycm-link-hover:hover { color: var(--rycm-red); }\n\n/* Cards lift by shadow only. No translate, no scale. */\n.rycm-card { transition: box-shadow var(--rycm-dur-ui) var(--rycm-ease); }\n.rycm-card:hover { box-shadow: var(--rycm-shadow-card-hover); }\n\n/* Nav-style cards on navy do translate up 4px. */\n.rycm-card-nav { transition: transform var(--rycm-dur-menu) var(--rycm-ease), background-color var(--rycm-dur-menu) var(--rycm-ease); }\n.rycm-card-nav:hover { transform: translateY(var(--rycm-lift-hover)); background-color: rgba(255, 255, 255, 0.08); }\n\n/* Editorial case card: image darkens + scales, overlay copy rises in. */\n.rycm-editorial img { transition: transform var(--rycm-dur-image) var(--rycm-ease), filter var(--rycm-dur-image) var(--rycm-ease); }\n.rycm-editorial:hover img { filter: brightness(0.58); transform: scale(var(--rycm-scale-image-hover)); }\n.rycm-editorial .rycm-editorial__hover { opacity: 0; transform: translateY(18px); transition: opacity var(--rycm-dur-reveal) var(--rycm-ease), transform var(--rycm-dur-reveal) var(--rycm-ease); }\n.rycm-editorial:hover .rycm-editorial__hover { opacity: 1; transform: translateY(0); }\n\n/* Text link with a widening arrow gap. */\n.rycm-arrow-link { transition: gap var(--rycm-dur-hover) var(--rycm-ease), opacity var(--rycm-dur-hover) var(--rycm-ease); }\n.rycm-arrow-link:hover { gap: 10px; opacity: 0.82; }\n\n@keyframes rycm-bubble-in-left { to { opacity: 1; transform: translateY(0) translateX(0) scale(1); } }\n@keyframes rycm-bubble-in-right { to { opacity: 1; transform: translateY(0) translateX(0) scale(1); } }\n@keyframes rycm-char-rise { from { opacity: 0; transform: translateY(110%) rotate(3deg); } to { opacity: 1; transform: translateY(0) rotate(0deg); } }\n@keyframes rycm-dot-pulse { 0%, 60%, 100% { opacity: 0.35; transform: scale(1); } 30% { opacity: 1; transform: scale(1.35); } }\n@keyframes rycm-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }\n@keyframes rycm-spin { to { transform: rotate(360deg); } }\n@keyframes rycm-hero-pan { from { background-position: left center; } to { background-position: 55% center; } }\n\n.rycm-bubble { opacity: 0; transform: translateY(12px) translateX(-28px) scale(0.97); animation: rycm-bubble-in-left var(--rycm-dur-bubble) var(--rycm-ease-back) forwards; animation-delay: calc(var(--i, 0) * var(--rycm-stagger-bubble) + 0.4s); }\n.rycm-bubble--agency { transform: translateY(12px) translateX(28px) scale(0.97); animation-name: rycm-bubble-in-right; }\n\n/* Admin interaction states. */\n.rycm-admin-btn { transition: background 0.12s ease, border-color 0.12s ease, opacity 0.12s ease; }\n.rycm-admin-btn:disabled { opacity: 0.5; cursor: not-allowed; }\n.rycm-admin-btn--primary:hover:not(:disabled) { background: #1e293b; }\n.rycm-admin-btn--secondary:hover:not(:disabled) { background: #f1f5f9; }\n.rycm-admin-btn--ghost:hover:not(:disabled) { background: #f1f5f9; }\n.rycm-admin-btn--danger:hover:not(:disabled) { background: #dc2626; }\n.rycm-admin-control:focus-visible { outline: none; border-color: var(--admin-accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25); }\n.rycm-admin-nav-item { transition: background 0.12s ease, color 0.12s ease; }\n.rycm-admin-nav-item:hover { background: rgba(226, 232, 240, 0.5); color: var(--admin-fg); }\n<\u002Fstyle>\n<style>/* Results You Can Measure — design system entry point.\n   Consumers link this one file. @import lines only. */\n/* DM Sans is the brand's only typeface (primary AND secondary per the 2024\n   Brand Identity Guidelines). It is a free Google Font; the production site\n   self-hosts it via @fontsource/dm-sans weights 400-900. Served here from\n   Google Fonts so cards and kits render identically without binaries in-repo.\n   Swap this @import for local @font-face blocks in a production build. */\n/* latin-ext */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: italic;\n  font-weight: 100 1000;\n  font-display: swap;\n  src: url(\"3d1f4863-2513-4f24-89c1-8632d0098721\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: italic;\n  font-weight: 100 1000;\n  font-display: swap;\n  src: url(\"ec8af287-8df7-4451-8951-22537dcb7dc6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 100 1000;\n  font-display: swap;\n  src: url(\"f3fe6df6-9b57-4e1c-ac66-164d7068f1ab\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 100 1000;\n  font-display: swap;\n  src: url(\"b23409a9-b6ca-4fc1-8713-5aef5d851ff2\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Inter is NOT a brand font. It is the typeface the RYCM Admin console sets\n   (RYCM_forms_system -> apps/admin/src/styles/global.css), kept so the internal\n   tool stays visually separate from the brand. Loaded from Google Fonts for the\n   same reason as DM Sans: no binaries were supplied. Upload woff2 files and\n   these two @import lines become real @font-face blocks. */\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"ec73d9a1-42ad-4c12-b1cb-ac1af139236a\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weig ycm-red);\n  --rycm-surface-page: var(--rycm-off-white);\n  --rycm-surface-card: rgba(255, 255, 255, 0.78);\n  --rycm-surface-card-solid: var(--rycm-white);\n  --rycm-surface-dark: var(--rycm-navy);\n  --rycm-surface-accent: var(--rycm-red);\n  --rycm-border: var(--rycm-line);\n  --rycm-link: var(--rycm-ink);\n  --rycm-link-hover: var(--rycm-red);\n  --rycm-focus: var(--rycm-red);\n\n  /* ── Compatibility aliases: the exact token names used in the\n     resultsyoucanmeasure.com stylesheet. Kept so code lifted from the site\n     works unchanged. ── */\n  --navy: var(--rycm-navy);\n  --red: var(--rycm-red);\n  --off: var(--rycm-off-white);\n  --white: var(--rycm-white);\n  --black: var(--rycm-black);\n  --ink: var(--rycm-ink);\n  --muted: var(--rycm-muted);\n  --line: var(--rycm-line);\n}\n\n:root {\n  --rycm-font-sans: \"DM Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --rycm-font-body: var(--rycm-font-sans);\n  --rycm-font-heading: var(--rycm-font-sans);\n  /* Only non-DM-Sans face on the brand: the oversized decorative quote mark */\n  --rycm-font-quote-mark: Georgia, \"Times New Roman\", serif;\n\n  /* Weights. Guidelines name Semibold + Medium as primary, Regular + Light as\n     secondary; the live site pushes to 800/900 for display and UI emphasis. */\n  --rycm-weight-light: 300; /* @kind other */\n  --rycm-weight-regular: 400; /* @kind other */\n  --rycm-weight-medium: 500; /* @kind other */\n  --rycm-weight-semibold: 600; /* @kind other */\n  --rycm-weight-bold: 700; /* @kind other */\n  --rycm-weight-extrabold: 800; /* @kind other */\n  --rycm-weight-black: 900;\n\n  /* Display — uppercase, near-solid leading, no letter-spacing */\n  --rycm-size-hero: clamp(2.6rem, 5vw, 6rem);\n  --rycm-lh-hero: 0.92; /* @kind other */\n  --rycm-size-panel: clamp(2.4rem, 5vw, 5.5rem);\n  --rycm-lh-panel: 0.9; /* @kind other */\n  --rycm-size-h2: clamp(1.7rem, 3.55vw, 3.3rem);\n  --rycm-lh-h2: 1.05; /* @kind other */\n  --rycm-size-h3: clamp(1.5rem, 2.4vw, 2.3rem);\n  --rycm-lh-h3: 1; /* @kind other */\n  --rycm-size-quote: clamp(2rem, 5vw, 5.2rem);\n  --rycm-lh-quote: 1; /* @kind other */\n  --rycm-size-wordmark: clamp(5rem, 18vw, 23rem);\n\n  /* Text */\n  --rycm-size-lede: clamp(1.08rem, 1.7vw, 1.45rem);\n  --rycm-lh-lede: 1.45; /* @kind other */\n  --rycm-size-body-lg: 1.15rem;\n  --rycm-size-article: 1.18rem;\n  --rycm-size-body: 1rem;\n  --rycm-size-small: 0.95rem;\n  --rycm-size-meta: 0.9rem;\n  --rycm-size-eyebrow: 14px;\n  --rycm-lh-body: 1.65; /* @kind other */\n  --rycm-lh-article: 1.7; /* @kind other */\n  --rycm-lh-tight: 1.45; /* @kind other */\n\n  --rycm-ls-eyebrow: 0.07em; /* @kind other */\n  --rycm-ls-display: 0; /* @kind other */\n  --rycm-ls-negative: -0.02em; /* @kind other */\n  --rycm-ls-label: 0.04em; /* @kind other */\n}\n\n:root {\n  --rycm-space-1: 4px;\n  --rycm-space-2: 8px;\n  --rycm-space-3: 12px;\n  --rycm-space-4: 16px;\n  --rycm-space-5: 18px;   /* the grid gap used across every card grid */\n  --rycm-space-6: 22px;\n  --rycm-space-7: 26px;   /* card padding */\n  --rycm-space-8: 28px;\n  --rycm-space-10: 34px;\n  --rycm-space-12: 42px;\n  --rycm-space-16: 56px;\n  --rycm-space-20: 72px;\n\n  /* Fluid page rhythm — the site never uses a fixed container width, it uses\n     symmetric fluid page padding and lets content max-widths do the framing. */\n  --rycm-page-pad: clamp(18px, 5vw, 72px);\n  --rycm-section-y: clamp(40px, 5vw, 72px); /* @kind spacing */\n  --rycm-hero-y: clamp(42px, 7vw, 90px); /* @kind spacing */\n  --rycm-card-pad: clamp(24px, 4vw, 42px);\n  --rycm-grid-gap: 18px;\n  --rycm-grid-gap-lg: clamp(18px, 2vw, 28px);\n  --rycm-texture-grid: 72px;\n\n  /* Content max-widths */\n  --rycm-measure-display: 980px;\n  --rycm-measure-lede: 710px;\n  --rycm-measure-copy: 820px;\n  --rycm-measure-article: 900px;\n\n  --page-pad: var(--rycm-page-pad);\n}\n\n:root {\n  --rycm-radius: 8px;             /* buttons, cards, panels — the default */\n  --rycm-radius-sm: 4px;          /* editorial case cards, chips on dark */\n  --rycm-radius-lg: 14px;         /* mega menu */\n  --rycm-radius-xl: 18px;         /* chat bubbles, proof panels */\n  --rycm-radius-pill: 999px;      /* tag row */\n  --rycm-radius-circle: 50%;      /* process numerals, avatars */\n\n  --rycm-border: 1px solid var(--rycm-line);\n  --rycm-border-dark: 1px solid var(--rycm-on-dark-line);\n  --rycm-border-strong: 1.5px solid var(--rycm-navy);\n  --rycm-rule-accent: 3px solid var(--rycm-red);\n\n  --rycm-shadow-card: 0 10px 30px rgba(7, 6, 48, 0.06);\n  --rycm-shadow-card-hover: 0 26px 64px rgba(7, 6, 48, 0.16);\n  --rycm-shadow-panel: 0 18px 48px rgba(7, 6, 48, 0.12);\n  --rycm-shadow-xl: 0 24px 70px rgba(7, 6, 48, 0.22);\n  --rycm-shadow-editorial: 0 30px 80px rgba(7, 6, 48, 0.25);\n  --rycm-shadow-bubble: 0 8px 28px rgba(0, 0, 0, 0.22);\n  --rycm-shadow-menu: 0 28px 80px rgba(0, 0, 0, 0.5);\n\n  --rycm-blur-header: blur(16px); /* @kind other */\n  --rycm-blur-menu: blur(20px); /* @kind other */\n  --rycm-header-bg: rgba(7, 6, 48, 0.92);\n\n  /* Protection gradients — how type stays legible over photography/video.\n     Always navy-tinted, never neutral black. */\n  --rycm-scrim-left: linear-gradient(90deg, rgba(7, 6, 48, 0.88) 0%, rgba(7, 6, 48, 0.54) 55%, rgba(7, 6, 48, 0.28) 100%); /* @kind other */\n  --rycm-scrim-bottom: linear-gradient(to top, rgba(7, 6, 48, 0.72) 0%, rgba(7, 6, 48, 0.05) 55%); /* @kind other */\n  --rycm-scrim-card: linear-gradient(180deg, rgba(7, 6, 48, 0.06) 0%, rgba(7, 6, 48, 0.08) 42%, rgba(7, 6, 48, 0.86) 100%); /* @kind other */\n\n  /* Signature background textures */\n  --rycm-texture-grid-light: linear-gradient(90deg, rgba(7, 6, 48, 0.035) 1px, transparent 1px),\n    linear-gradient(rgba(7, 6, 48, 0.035) 1px, transparent 1px); /* @kind other */\n  --rycm-texture-grid-dark: linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),\n    linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px); /* @kind other */\n  --rycm-glow-red: radial-gradient(circle at 12% 20%, rgba(248, 55, 57, 0.24), transparent 30%); /* @kind other */\n\n  --radius: var(--rycm-radius);\n  --shadow: var(--rycm-shadow-xl);\n}\n\n:root {\n  /* Two easings do almost all the work on this brand. */\n  --rycm-ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */  /* reveals, card rise, wordmark */\n  --rycm-ease-back: cubic-bezier(0.175, 0.885, 0.32, 1.275); /* @kind other */ /* chat bubbles — the one overshoot */\n  --rycm-ease: ease; /* @kind other */\n\n  --rycm-dur-hover: 0.15s; /* @kind other */\n  --rycm-dur-menu: 0.18s; /* @kind other */\n  --rycm-dur-ui: 0.25s; /* @kind other */\n  --rycm-dur-reveal: 0.45s; /* @kind other */\n  --rycm-dur-image: 0.65s; /* @kind other */\n  --rycm-dur-bubble: 0.5s; /* @kind other */\n  --rycm-dur-wordmark: 1.45s; /* @kind other */\n\n  --rycm-stagger-bubble: 0.52s; /* @kind other */\n  --rycm-stagger-char: 0.11s; /* @kind other */\n\n  --rycm-lift-hover: -4px;   /* nav cards lift on hover */\n  --rycm-scale-image-hover: 1.04; /* @kind other */\n}\n\n@media (prefers-reduced-motion: reduce) {\n  :root {\n    --rycm-dur-reveal: 0.01s; /* @kind other */\n    --rycm-dur-image: 0.01s; /* @kind other */\n    --rycm-dur-bubble: 0.01s; /* @kind other */\n    --rycm-dur-wordmark: 0.01s; /* @kind other */\n  }\n}\n\n/* RYCM Admin (the forms / ops console) runs a deliberately quiet slate UI —\n   it is an internal tool, not a brand surface. Only the logo and the accent\n   carry the brand, and it does NOT use the brand typeface: the real console\n   sets Inter (apps/admin/src/styles/global.css). Scope these by putting\n   .rycm-admin on a wrapper. */\n.rycm-admin {\n  --admin-bg: #fafafa;\n  --admin-fg: #0f172a;\n  --admin-muted: #64748b;\n  --admin-border: #e2e8f0;\n  --admin-card: #ffffff;\n  --admin-primary: #0f172a;\n  --admin-primary-fg: #ffffff;\n  --admin-accent: #2563eb;\n  --admin-danger: #b91c1c;\n\n  --admin-success-bg: #d1fae5;\n  --admin-success-fg: #065f46;\n  --admin-warning-bg: #fef3c7;\n  --admin-warning-fg: #92400e;\n  --admin-danger-bg: #fee2e2;\n  --admin-danger-fg: #991b1b;\n  --admin-muted-bg: #f1f5f9;\n  --admin-muted-fg: #475569;\n\n  --admin-radius: 6px;\n  --admin-radius-lg: 8px;\n  --admin-shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);\n  --admin-sidebar-w: 240px; /* @kind other */\n  --admin-font: Inter, ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --admin-row-h: 36px; /* @kind other */\n  --admin-control-h: 40px; /* @kind other */\n  --admin-control-h-sm: 32px; /* @kind other */\n\n  background: var(--admin-bg);\n  color: var(--admin-fg);\n  font-family: var(--admin-font);\n}\n\n/* Interaction states and signature backgrounds that need real CSS (pseudo\n   classes, keyframes, masks) rather than inline style. Components in this\n   system attach these class names alongside their inline token styles. */\n\n.rycm-body {\n  margin: 0;\n  font-family: var(--rycm-font-body);\n  color: var(--rycm-ink);\n  background: var(--rycm-off-white);\n  -webkit-font-smoothing: antialiased;\n}\n\na { color: var(--rycm-link); }\na:hover { color: var(--rycm-link-hover); }\n\n/* The site's ambient texture: a 72px navy grid fading out down the page. */\n.rycm-grid-texture::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  pointer-events: none;\n  background: var(--rycm-texture-grid-light);\n  background-size: var(--rycm-texture-grid) var(--rycm-texture-grid);\n  mask-image: linear-gradient(to bottom, black, transparent 75%);\n}\n.rycm-grid-texture--dark::before {\n  background: var(--rycm-texture-grid-dark);\n  background-size: var(--rycm-texture-grid) var(--rycm-texture-grid);\n  mask-image: linear-gradient(to bottom, transparent 0, black 18%, black 82%, transparent 100%);\n}\n\n/* Buttons — hover is a small darkening / fill, never a scale or a shadow pop. */\n.rycm-btn { transition: background var(--rycm-dur-hover) var(--rycm-ease), color var(--rycm-dur-hover) var(--rycm-ease), border-color var(--rycm-dur-hover) var(--rycm-ease), opacity var(--rycm-dur-hover) var(--rycm-ease); }\n.rycm-btn--primary:hover { background: #c01f23; border-color: #c01f23; }\n.rycm-btn--secondary:hover { background: var(--rycm-navy); border-color: var(--rycm-navy); color: var(--rycm-white); }\n.rycm-btn--outline:hover { border-color: var(--rycm-white); background: rgba(255, 255, 255, 0.08); }\n.rycm-btn:active { opacity: 0.9; }\n.rycm-btn:focus-visible, .rycm-focusable:focus-visible { outline: 2px solid var(--rycm-focus); outline-offset: 2px; }\n\n.rycm-link-hover:hover { color: var(--rycm-red); }\n\n/* Cards lift by shadow only. No translate, no scale. */\n.rycm-card { transition: box-shadow var(--rycm-dur-ui) var(--rycm-ease); }\n.rycm-card:hover { box-shadow: var(--rycm-shadow-card-hover); }\n\n/* Nav-style cards on navy do translate up 4px. */\n.rycm-card-nav { transition: transform var(--rycm-dur-menu) var(--rycm-ease), background-color var(--rycm-dur-menu) var(--rycm-ease); }\n.rycm-card-nav:hover { transform: translateY(var(--rycm-lift-hover)); background-color: rgba(255, 255, 255, 0.08); }\n\n/* Editorial case card: image darkens + scales, overlay copy rises in. */\n.rycm-editorial img { transition: transform var(--rycm-dur-image) var(--rycm-ease), filter var(--rycm-dur-image) var(--rycm-ease); }\n.rycm-editorial:hover img { filter: brightness(0.58); transform: scale(var(--rycm-scale-image-hover)); }\n.rycm-editorial .rycm-editorial__hover { opacity: 0; transform: translateY(18px); transition: opacity var(--rycm-dur-reveal) var(--rycm-ease), transform var(--rycm-dur-reveal) var(--rycm-ease); }\n.rycm-editorial:hover .rycm-editorial__hover { opacity: 1; transform: translateY(0); }\n\n/* Text link with a widening arrow gap. */\n.rycm-arrow-link { transition: gap var(--rycm-dur-hover) var(--rycm-ease), opacity var(--rycm-dur-hover) var(--rycm-ease); }\n.rycm-arrow-link:hover { gap: 10px; opacity: 0.82; }\n\n@keyframes rycm-bubble-in-left { to { opacity: 1; transform: translateY(0) translateX(0) scale(1); } }\n@keyframes rycm-bubble-in-right { to { opacity: 1; transform: translateY(0) translateX(0) scale(1); } }\n@keyframes rycm-char-rise { from { opacity: 0; transform: translateY(110%) rotate(3deg); } to { opacity: 1; transform: translateY(0) rotate(0deg); } }\n@keyframes rycm-dot-pulse { 0%, 60%, 100% { opacity: 0.35; transform: scale(1); } 30% { opacity: 1; transform: scale(1.35); } }\n@keyframes rycm-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }\n@keyframes rycm-spin { to { transform: rotate(360deg); } }\n@keyframes rycm-hero-pan { from { background-position: left center; } to { background-position: 55% center; } }\n\n.rycm-bubble { opacity: 0; transform: translateY(12px) translateX(-28px) scale(0.97); animation: rycm-bubble-in-left var(--rycm-dur-bubble) var(--rycm-ease-back) forwards; animation-delay: calc(var(--i, 0) * var(--rycm-stagger-bubble) + 0.4s); }\n.rycm-bubble--agency { transform: translateY(12px) translateX(28px) scale(0.97); animation-name: rycm-bubble-in-right; }\n\n/* Admin interaction states. */\n.rycm-admin-btn { transition: background 0.12s ease, border-color 0.12s ease, opacity 0.12s ease; }\n.rycm-admin-btn:disabled { opacity: 0.5; cursor: not-allowed; }\n.rycm-admin-btn--primary:hover:not(:disabled) { background: #1e293b; }\n.rycm-admin-btn--secondary:hover:not(:disabled) { background: #f1f5f9; }\n.rycm-admin-btn--ghost:hover:not(:disabled) { background: #f1f5f9; }\n.rycm-admin-btn--danger:hover:not(:disabled) { background: #dc2626; }\n.rycm-admin-control:focus-visible { outline: none; border-color: var(--admin-accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25); }\n.rycm-admin-nav-item { transition: background 0.12s ease, color 0.12s ease; }\n.rycm-admin-nav-item:hover { background: rgba(226, 232, 240, 0.5); color: var(--admin-fg); }\n\n<\u002Fstyle>\n<script src=\"70d505d1-10a2-420f-b731-a4e5eacb29b0\"><\u002Fscript>\n<style>\nbody{margin:0;background:#e9e7e2;font-fami ;font:400 14px 'DM Sans';color:#a3a3ad\">••••••••<\u002Fdiv>\n<div style=\"margin-top:8px\"><x-import component-from-global-scope=\"ResultsYouCanMeasureDesignSystem_3a5dcd.Button\" hint-size=\"auto,44px\">Sign in<\u002Fx-import><\u002Fdiv>\n<p style=\"margin:14px 0 0;font:400 13px/1.6 'DM Sans';color:#6d6d7c\">No account yet? <a href=\"#1b\" style=\"color:#d6262a;font-weight:600\">Register<\u002Fa>. Forgotten password?<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n\n<div class=\"dv-opt\" id=\"1b\"><div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#1b\">1b<\u002Fa>Register — individual or organisation<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:560px;background:#F1F1F1\">\n<div style=\"padding:34px 44px 12px\">\n<x-import component-from-global-scope=\"ResultsYouCanMeasureDesignSystem_3a5dcd.Eyebrow\" hint-size=\"auto,18px\">STEP 1 OF 2<\u002Fx-import>\n<h1 style=\"margin:12px 0 8px;font:900 30px/.92 'DM Sans';text-transform:uppercase;color:#070630\">Create an account<\u002Fh1>\n<p style=\"margin:0;font:400 14.5px/1.6 'DM Sans';color:#6d6d7c\">Accounts are checked by the team before you can post. This usually takes one working day.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding:20px 44px 0;display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n<div style=\"border:2px solid #d6262a;border-radius:8px;background:#fff;padding:16px\">\n<div style=\"display:flex;justify-content:space-between;align-items:flex-start\"><span style=\"font:800 15px 'DM Sans';color:#070630\">Individual<\u002Fspan><span style=\"width:16px;height:16px;border-radius:50%;border:5px solid #d6262a;flex:none\"><\u002Fspan><\u002Fdiv>\n<p style=\"margin:6px 0 0;font:400 12.5px/1.5 'DM Sans';color:#6d6d7c\">Posting in your own name. You can link to an organisation later.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border:1px solid rgba(7,6,48,.2);border-radius:8px;background:rgba(255,255,255,.78);padding:16px\">\n<div style=\"display:flex;justify-content:space-between;align-items:flex-start\"><span style=\"font:800 15px 'DM Sans';color:#070630\">Organisation<\u002Fspan><span style=\"width:16px;height:16px;border-radius:50%;border:1px solid rgba(7,6,48,.3);flex:none\"><\u002Fspan><\u002Fdiv>\n<p style=\"margin:6px 0 0;font:400 12.5px/1.5 'DM Sans';color:#6d6d7c\">Posting on behalf of a group. You can invite colleagues as members.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:24px 44px 40px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n<div><div style=\"font:500 11.5px/1 'DM Sans';letter-spacing:.04em;color:#6d6d7c;text-transform:uppercase;margin-bottom:6px\">First name<\u002Fdiv><div style=\"height:42px;border:1px solid rgba(7,6,48,.2);border-radius:8px;background:#fff\"><\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:500 11.5px/1 'DM Sans';letter-spacing:.04em;color:#6d6d7c;text-transform:uppercase;margin-bottom:6px\">Last name<\u002Fdiv><div style=\"height:42px;border:1px solid rgba(7,6,48,.2);border-radius:8px;background:#fff\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div><div style=\"font:500 11.5px/1 'DM Sans';letter-spacing:.04em;color:#6d6d7c;text-transform:uppercase;margin-bottom:6px\">Email (from your Microsoft account)<\u002Fdiv><div style=\"height:42px;border:1px solid rgba(7,6,48,.2);border-radius:8px;background:#f6f6f6;display:flex;align-items:center;padding:0 13px;font:400 14px 'DM Sans';color:#6d6d7c\">m.hussain@bradfordtrust.org.uk<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:500 11.5px/1 'DM Sans';letter-spacing:.04em;color:#6d6d7c;text-transform:uppercase;margin-bottom:6px\">Why you want to post (seen by the team)<\u002Fdiv><div style=\"height:76px;border:1px solid rgba(7,6,48,.2);border-radius:8px;background:#fff\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:10px;align-items:flex-start;margin-top:2px\"><span style=\"width:16px;height:16px;border:1px solid rgba(7,6,48,.3);border-radius:3px;flex:none;margin-top:2px\"><\u002Fspan><span style=\"font:400 12.5px/1.5 'D ap:10px\"><span style=\"color:#d6262a;font-weight:800\">2<\u002Fspan>Finish your organisation profile so listings show your logo.<\u002Fdiv>\n<div style=\"display:flex;gap:10px\"><span style=\"color:#d6262a;font-weight:800\">3<\u002Fspan>Start a draft. You can write now and submit once approved.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:22px 0 0;font:400 12.5px/1.5 'DM Sans';color:#6d6d7c\">Submitted 14 March, 09:12. Something wrong? <a href=\"#1c\" style=\"color:#d6262a;font-weight:600\">Contact the team<\u002Fa>.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n\n<div class=\"dv-opt\" id=\"1d\"><div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#1d\">1d<\u002Fa>Dashboard home — category tiles<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:1180px\">\n<div style=\"display:flex;min-height:720px;background:#F1F1F1\">\n<aside style=\"width:232px;flex:none;background:#070630;padding:22px 0;display:flex;flex-direction:column\">\n<div style=\"padding:0 20px 26px;display:flex;align-items:center;gap:9px\"><span style=\"width:22px;height:22px;border-radius:50%;background:#d6262a;flex:none\"><\u002Fspan><span style=\"font:800 11.5px/1 'DM Sans';letter-spacing:.07em;color:#fff\">LOGO / MEMBER AREA<\u002Fspan><\u002Fdiv>\n<a href=\"#1d\" style=\"display:flex;align-items:center;gap:10px;padding:9px 20px;border-left:3px solid #d6262a;background:rgba(255,255,255,.08);font:600 13.5px 'DM Sans';color:#fff;text-decoration:none\">Dashboard<\u002Fa>\n<div style=\"padding:18px 20px 8px;font:600 10.5px/1 'DM Sans';letter-spacing:.09em;color:rgba(255,255,255,.5)\">MY SUBMISSIONS<\u002Fdiv>\n<a href=\"#1e\" style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 20px;border-left:3px solid transparent;font:500 13.5px 'DM Sans';color:rgba(255,255,255,.78);text-decoration:none\">Events<span style=\"font:600 11px 'DM Sans';color:rgba(255,255,255,.5)\">6<\u002Fspan><\u002Fa>\n<a href=\"#1e\" style=\"display:flex;align-items:center;justify-content:space-b parent;font:500 13.5px 'DM Sans';color:rgba(255,255,255,.78);text-decoration:none\">Organisation &amp; profile<\u002Fa>\n<div style=\"margin-top:auto;padding:20px 20px 0;border-top:1px solid rgba(255,255,255,.14)\">\n<div style=\"font:600 12.5px/1.4 'DM Sans';color:#fff\">Mariam Hussain<\u002Fdiv>\n<div style=\"font:400 11.5px/1.4 'DM Sans';color:rgba(255,255,255,.5)\">Bradford Community Trust<\u002Fdiv>\n<div style=\"margin-top:10px;font:500 12px 'DM Sans';color:rgba(255,255,255,.72)\">Sign out<\u002Fdiv>\n<\u002Fdiv>\n<\u002Faside>\n<main style=\"flex:1;min-width:0;padding:30px 34px 40px\">\n<div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:20px\">\n<div><h1 style=\"margin:0 0 6px;font:900 30px/.94 'DM Sans';text-transform:uppercase;color:#070630\">Your dashboard<\u002Fh1><p style=\"margin:0;font:400 14px/1.6 'DM Sans';color:#6d6d7c\">Posting as Bradford Community Trust. Everything you submit is checked before it appears on the site.<\u002Fp><\u002Fdiv>\n<x-import component-from-global-scope=\"ResultsYouCanMeasureDesignSystem_3a5dcd.Button\" hint-size=\"auto,44px\">New submission<\u002Fx-import>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0 10px\">\n<div style=\"background:rgba(255,255,255,.78);border:1px solid rgba(7,6,48,.13);border-radius:8px;padding:16px 18px\"><div style=\"font:600 10.5px/1 'DM Sans';letter-spacing:.08em;color:#6d6d7c\">AWAITING REVIEW<\u002Fdiv><div style=\"font:900 30px/1.1 'DM Sans';color:#070630;margin-top:6px\">4<\u002Fdiv><\u002Fdiv>\n<div style=\"background:rgba(255,255,255,.78);border:1px solid rgba(7,6,48,.13);border-radius:8px;padding:16px 18px\"><div style=\"font:600 10.5px/1 'DM Sans';letter-spacing:.08em;color:#6d6d7c\">LIVE ON SITE<\u002Fdiv><div style=\"font:900 30px/1.1 'DM Sans';color:#070630;margin-top:6px\">9<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d6262a;border-radius:8px;padding:16px 18px\"><div style=\"font
